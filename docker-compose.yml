# OPTIONAL deployment helper — not required for local development.
# Local development uses your existing PostgreSQL + pgAdmin 4 and does not need Docker (see README).
#
# This brings up PostgreSQL and the application together, reading secrets from .env.
#   docker compose up --build
# The database roles (wms_owner, wms_app) and the wms schema are created on first start by docker/init-db.sh;
# their passwords come from .env. Flyway then creates the tables and grants.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WMS_DB_OWNER_PASSWORD: ${WMS_DB_OWNER_PASSWORD}
      WMS_DB_APP_PASSWORD: ${WMS_DB_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - wms-db-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-wms-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      WMS_DB_URL: jdbc:postgresql://db:5432/warehouse_db
      WMS_DB_OWNER_USER: wms_owner
      WMS_DB_OWNER_PASSWORD: ${WMS_DB_OWNER_PASSWORD}
      WMS_DB_APP_USER: wms_app
      WMS_DB_APP_PASSWORD: ${WMS_DB_APP_PASSWORD}
      WMS_JWT_SECRET: ${WMS_JWT_SECRET}
      WMS_BOOTSTRAP_ADMIN_USERNAME: ${WMS_BOOTSTRAP_ADMIN_USERNAME}
      WMS_BOOTSTRAP_ADMIN_EMAIL: ${WMS_BOOTSTRAP_ADMIN_EMAIL}
      WMS_BOOTSTRAP_ADMIN_PASSWORD: ${WMS_BOOTSTRAP_ADMIN_PASSWORD}
      WMS_CORS_ALLOWED_ORIGINS: ${WMS_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"

volumes:
  wms-db-data:
